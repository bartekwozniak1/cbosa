name: NSA document downloader POC

on:
  workflow_dispatch:
    inputs:
      manifest_run_id:
        description: Run ID workflow nsa-manifest.yml
        required: true
        default: "31024452072"
      previous_documents_run_id:
        description: Poprzedni run dokumentów do wznowienia
        required: false
        default: ""
      limit:
        description: Liczba dokumentów z manifestu
        required: true
        default: "10"

permissions:
  actions: read
  contents: read

jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start hola-proxy
        run: make proxy

      - name: Download manifest artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p manifest-input

          gh run download "${{ inputs.manifest_run_id }}" \
            -R "${{ github.repository }}" \
            --dir manifest-input

          MANIFEST="$(
            find manifest-input \
              -name nsa_manifest.jsonl \
              -print \
              -quit
          )"

          if [[ -z "$MANIFEST" ]]; then
            echo "Nie znaleziono nsa_manifest.jsonl"
            exit 1
          fi

          echo "MANIFEST_PATH=$MANIFEST" >> "$GITHUB_ENV"

      - name: Download previous document artifact
        if: inputs.previous_documents_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-documents

          gh run download "${{ inputs.previous_documents_run_id }}" \
            -R "${{ github.repository }}" \
            --dir previous-documents

          RESUME_JSONL="$(
            find previous-documents \
              -name nsa_documents.jsonl \
              -print \
              -quit
          )"

          if [[ -z "$RESUME_JSONL" ]]; then
            echo "Nie znaleziono poprzedniego nsa_documents.jsonl"
            exit 1
          fi

          echo "RESUME_JSONL=$RESUME_JSONL" >> "$GITHUB_ENV"

      - name: Run document downloader
        id: downloader
        continue-on-error: true
        env:
          HTTP_PROXY: http://127.0.0.1:8080
        run: |
          ARGS=(
            --manifest "$MANIFEST_PATH"
            --output-dir documents-output
            --proxy http://127.0.0.1:8080
            --limit "${{ inputs.limit }}"
            --delay-min 10
            --delay-max 15
          )

          if [[ -n "${RESUME_JSONL:-}" ]]; then
            ARGS+=(--resume-jsonl "$RESUME_JSONL")
          fi

          python3 nsa_documents.py "${ARGS[@]}"

      - name: Show audit
        if: always()
        run: |
          echo "===== NSA_DOCUMENTS_AUDIT.md ====="
          cat documents-output/NSA_DOCUMENTS_AUDIT.md 2>/dev/null || true

          echo
          echo "===== DOCUMENT COUNT ====="
          wc -l documents-output/nsa_documents.jsonl 2>/dev/null || true

          echo
          echo "===== RAW HTML COUNT ====="
          find documents-output/raw -name '*.html' 2>/dev/null | wc -l

          echo
          echo "===== PROXY LOG ====="
          make logs || true

      - name: Upload document artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsa-documents-${{ github.run_id }}
          path: |
            documents-output/nsa_documents.jsonl
            documents-output/NSA_DOCUMENTS_AUDIT.md
            documents-output/raw
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when downloader incomplete
        if: steps.downloader.outcome == 'failure'
        run: exit 1
